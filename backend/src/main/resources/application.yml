server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:community}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 通过 SLF4J 输出 SQL，由日志级别控制，避免直接打到 stdout 泄露数据
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 必须通过环境变量 JWT_SECRET 注入（长度 >= 32 字节），无默认值，缺失则启动失败
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS 跨域白名单（逗号分隔），生产环境请通过 CORS_ALLOWED_ORIGINS 指定真实域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}

# 阿里云 OSS 配置
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:zhugeqingyun2}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}